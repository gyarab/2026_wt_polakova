<body>
    <h1>Smažený sýr</h1>

    <h2>Ingredience</h2>

        <li>sýr</li>
        <li>vajíčko</li>
        <li>mouka</li>

        <li>sýr obalit v mouce, potom ve vajíčku a potom v ostrouhaném rohlíku</li>
